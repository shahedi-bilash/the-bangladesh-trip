      <a class="pin" href="plan.html?region=coxs-bazar-saint-martin" tabindex="0" data-t="Cox's Bazar &amp; St Martin" data-s="coast &amp; island" aria-label="Plan: Cox's Bazar and Saint Martin">
        <circle class="ring" cx="416" cy="582" r="8"/><circle class="dot" cx="416" cy="582" r="7"/><text class="lab" x="401" y="586" text-anchor="end">Cox's Bazar</text></a>
    </svg>
  </div>
  <script>
    const svg=document.getElementById('bdmap'), tip=document.getElementById('tip'), tb=tip.querySelector('b'), ts=tip.querySelector('span');
    svg.querySelectorAll('.pin').forEach(pin=>{ const dot=pin.querySelector('.dot');
      const show=()=>{ const w=svg.parentElement.getBoundingClientRect(), r=dot.getBoundingClientRect();
        tb.textContent=pin.dataset.t; ts.textContent=pin.dataset.s; tip.style.left=(r.left-w.left+r.width/2)+'px'; tip.style.top=(r.top-w.top)+'px'; tip.classList.add('show'); };
      const hide=()=>tip.classList.remove('show');
      pin.addEventListener('mouseenter',show); pin.addEventListener('mouseleave',hide); pin.addEventListener('focus',show); pin.addEventListener('blur',hide); });
  </script>
